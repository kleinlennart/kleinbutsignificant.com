# Quarto renders computational posts to Markdown that Astro then builds.
#   content/writing/<slug>/<slug>.qmd  ->  <slug>.md + <slug>_files/
# Render locally and commit the output; Vercel never runs R or Python.
#   uv run quarto render content/writing/<slug>/<slug>.qmd

project:
  type: default
  execute-dir: file
  render:
    - "content/**/*.qmd"
    # Reads the v1 PaperMod submodule, which no longer exists: keep its committed output as-is.
    - "!content/writing/commit-badge/"

format:
  hugo-md: # plain Markdown + YAML frontmatter; images as Markdown syntax where possible
    fig-format: svg
    fig-dpi: 600
    code-fold: false
    mermaid-format: png
    mermaid:
      theme: neutral

execute:
  warning: false
  # Only re-execute a post when its source changes. Results live in _freeze/ (commit it).
  freeze: auto
