# Quarto renders computational posts to Markdown that Astro then builds.
#   content/writing/<slug>/<slug>.qmd  ->  <slug>.md + <slug>_files/
# Render locally and commit the output; Vercel never runs R or Python.
#   uv run quarto render content/writing/<slug>/<slug>.qmd

project:
  type: default
  execute-dir: file
  render:
    - "content/**/*.qmd"
    # Reads the v1 PaperMod submodule, which no longer exists: keep its committed output as-is.
    - "!content/writing/commit-badge/"

format:
  hugo-md: # plain Markdown + YAML frontmatter; images as Markdown syntax where possible
    fig-format: svg
    fig-dpi: 600
    code-fold: false
    mermaid-format: png
    mermaid:
      theme: neutral

# Citations: [@key] from the Zotero export (Better BibTeX → Better CSL JSON, "keep updated").
# Quarto leaves [@key] as-is in the .md (citeproc: false); Astro formats every post's citations
# at build time (rehype-citation, APSA), so .qmd and .md posts look the same and Zotero fixes
# apply without re-rendering. `bibliography` stays so the editors can autocomplete keys.
bibliography: content/references.json
citeproc: false

execute:
  warning: false
  # Only re-execute a post when its source changes. Results live in _freeze/ (commit it).
  freeze: auto
