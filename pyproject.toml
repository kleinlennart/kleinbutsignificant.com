# Python environment for Quarto's Jupyter engine (Python code cells in posts).
# Managed with uv:  uv sync   then   uv run quarto render <file>
[project]
name = "kleinbutsignificant"
version = "2.0.0"
description = "Python environment for computational posts on kleinbutsignificant.com"
requires-python = ">=3.14"
dependencies = [
    "jupyter",
    "jupyter-cache",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
# Format .py scripts only. Markdown is prose (and content/*.md is Quarto output);
# Python chunks in .qmd are formatted in the editor ("Quarto: Format Cell").
extend-exclude = ["*.md", "rv/"]
